name: Bug report
description: Report a reproducible problem
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, placeholder: Steps, expected vs actual}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Reproduction, placeholder: How to reproduce}
    validations: {required: true}
