# Agent Contribution Workflow — issue -> branch -> PR -> merge -> cleanup -> close.
# Enforces: every PR must reference an issue (e.g. "Closes #12").
name: contribution-guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master, main]

jobs:
  require-linked-issue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body references an issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "") + "\n" + (context.payload.pull_request.title || "");
            const ok = /(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#\d+/i.test(body);
            if (!ok) {
              core.setFailed("PR must reference an issue, e.g. 'Closes #12'. Create the GitHub issue first, then branch from it.");
            } else {
              core.info("PR correctly references an issue.");
            }

  branch-naming:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce <type>/<issue>-<slug> branch names
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const ok = /^(feat|fix|chore|docs|refactor|test)\/\d+-[a-z0-9-]+$/.test(branch);
            if (!ok) {
              core.setFailed(`Branch '${branch}' must look like feat/12-short-slug or fix/12-short-slug (issue number required).`);
            } else {
              core.info(`Branch name '${branch}' OK.`);
            }

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: |
          python -m py_compile backend/app/main.py backend/alembic/env.py
          python -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('backend/app').rglob('*.py')]; print('backend AST OK')"
